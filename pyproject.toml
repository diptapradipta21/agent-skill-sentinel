[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-sentinel"
version = "0.1.0"
description = "Zero-token static security scanner & prompt injection detector for AI Agent skills and MCP tools."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Fajar Indra Pradipta Gajah", email = "diptapradipta21@gmail.com" }
]
license = { text = "MIT" }
keywords = ["ai-agents", "security", "prompt-injection", "mcp", "llm-guardrails", "zero-token"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.scripts]
skill-sentinel = "sentinel:main"

[tool.setuptools.package-dir]
"" = "src"
